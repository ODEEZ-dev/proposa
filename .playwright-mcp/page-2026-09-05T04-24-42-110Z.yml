            - generic [ref=e122]:
              - heading "A High-Converting Marketing Website for Acme Corp — Designed to Turn Visitors into Customers" [level=1] [ref=e372]
              - heading "Executive Summary" [level=2] [ref=e373]
              - paragraph [ref=e374]: "Your website is often the first conversation a potential customer has with your brand — and in most cases, it's the conversation that decides whether they buy from you or move on to a competitor. A generic, template-driven site simply doesn't earn that trust. What Acme Corp needs is a marketing website engineered from the ground up to convert: one that communicates your value in seconds, guides visitors toward a clear next step, and looks as professional as the work you do."
              - paragraph [ref=e375]: Acme Studio specializes in building exactly that. We combine conversion-focused design thinking with clean, responsive development and a brand identity system that makes your business instantly recognizable across every touchpoint. We don't just hand over pixels — we build a digital foundation that actively contributes to revenue growth.
              - paragraph [ref=e376]: This proposal outlines a focused, four-week engagement to deliver a custom marketing website and brand identity package for Acme Corp. It's built to be efficient, transparent, and — most importantly — profitable for your business.
              - heading "Scope of Work" [level=2] [ref=e377]
              - paragraph [ref=e378]:
                - strong [ref=e379]: "Deliverable 1: Website Design & Development"
              - list [ref=e380]:
                - listitem [ref=e381]: ✓ Discovery and conversion strategy session to define goals, audience, and key user journeys
                - listitem [ref=e382]: ✓ Custom, conversion-focused visual design tailored to your brand and audience
                - listitem [ref=e383]: ✓ Responsive development across desktop, tablet, and mobile devices
                - listitem [ref=e384]: ✓ Content Management System (CMS) integration so your team can update content without touching code
                - listitem [ref=e385]: "✓ Search engine optimization fundamentals: semantic structure, metadata, clean URLs, performance optimization, and accessibility best practices"
                - listitem [ref=e386]: ✓ Cross-browser and cross-device testing prior to launch
                - listitem [ref=e387]: ✓ Launch support and post-launch monitoring
              - paragraph [ref=e388]:
                - strong [ref=e389]: "Deliverable 2: Brand Identity Design"
              - list [ref=e390]:
                - listitem [ref=e391]: ✓ Primary logo with alternate lockups and usage variations
                - listitem [ref=e392]: ✓ Complete logo suite including primary, secondary, and icon marks
                - listitem [ref=e393]: ✓ Curated color palette with defined primary, secondary, and accent colors
                - listitem [ref=e394]: ✓ Typography system with hierarchy guidelines across web and print
                - listitem [ref=e395]: ✓ Comprehensive brand guidelines document covering logo usage, color application, typography, voice, and visual style
                - listitem [ref=e396]: ✓ Final asset package delivered in all required formats (SVG, PNG, EPS, PDF)
              - heading "Timeline" [level=2] [ref=e397]
              - paragraph [ref=e398]: "Total engagement: 4 weeks from project start."
              - list [ref=e399]:
                - listitem [ref=e400]:
                  - text: ✓
                  - strong [ref=e401]: "Week 1 — Discovery & Strategy:"
                  - text: Kickoff workshop, audience research, conversion strategy, sitemap, and content planning. Brand discovery session to define direction and inspiration.
                - listitem [ref=e402]:
                  - text: ✓
                  - strong [ref=e403]: "Week 2 — Design & Identity:"
                  - text: Logo concepts, color and typography exploration, website wireframes, and high-fidelity mockups for key pages. Client review and feedback round.
                - listitem [ref=e404]:
                  - text: ✓
                  - strong [ref=e405]: "Week 3 — Development & Refinement:"
                  - text: Responsive build, CMS integration, content entry, and SEO foundation. Brand guidelines drafted and design refinements implemented.
                - listitem [ref=e406]:
                  - text: ✓
                  - strong [ref=e407]: "Week 4 — Testing, Launch & Handoff:"
                  - text: Cross-browser testing, final QA, client training on the CMS, brand guideline delivery, and website launch.
              - heading "Investment" [level=2] [ref=e408]
              - paragraph [ref=e409]:
                - text: This engagement is scoped and priced based on a project fee within the
                - strong [ref=e410]: $5,000 – $15,000
                - text: range, with the final figure determined by the complexity of the design, the number of pages and templates, and the depth of the brand identity package. A precise, fixed-price proposal will be provided after our discovery session, so you know exactly what you're investing before any work begins.
              - paragraph [ref=e411]: Given the four-week timeline and the dual scope of work included in this engagement, we anticipate landing toward the middle to upper portion of the range to reflect the combined website and brand identity delivery.
              - heading "Terms & Conditions" [level=2] [ref=e412]
              - list [ref=e413]:
                - listitem [ref=e414]:
                  - text: ✓
                  - strong [ref=e415]: "Deposit:"
                  - text: A 50% deposit is required to secure your project slot and initiate work. The remaining 50% is due upon project completion, prior to final file delivery and website launch.
                - listitem [ref=e416]:
                  - text: ✓
                  - strong [ref=e417]: "Payment Schedule:"
                  - text: For longer engagements, milestone-based payment schedules can be arranged and will be outlined in the final agreement.
                - listitem [ref=e418]:
                  - text: ✓
                  - strong [ref=e419]: "Revisions Policy:"
                  - text: Each project phase includes two (2) rounds of revisions. Additional revision rounds are billed at our standard hourly rate and will be communicated in advance.
                - listitem [ref=e420]:
                  - text: ✓
                  - strong [ref=e421]: "Client Responsibilities:"
                  - text: Timely feedback, content delivery (copy, photography, branding inputs), and approvals are required to maintain the project timeline. Delays in client deliverables may extend the project completion date.
                - listitem [ref=e422]:
                  - text: ✓
                  - strong [ref=e423]: "Ownership:"
                  - text: Upon final payment, full ownership of all deliverables transfers to Acme Corp, including source files, final assets, and website code.
                - listitem [ref=e424]:
                  - text: ✓
                  - strong [ref=e425]: "Cancellation:"
                  - text: Either party may terminate the agreement with written notice. If the project is canceled, the client is responsible for payment of all work completed to date. The initial deposit is non-refundable.
                - listitem [ref=e426]:
                  - text: ✓
                  - strong [ref=e427]: "Confidentiality:"
                  - text: All proprietary information shared during the engagement will be treated as confidential by both parties.
              - heading "Call to Action" [level=2] [ref=e428]
              - paragraph [ref=e429]: Your competitors are investing in their digital presence right now. Every week your new website isn't live is a week of lost leads, missed conversions, and untapped revenue. Acme Studio is ready to move — and with a four-week timeline, we can have your new website and brand identity in market before the quarter closes.
              - paragraph [ref=e430]:
                - strong [ref=e431]: Let's schedule a 30-minute discovery call this week
                - text: to walk through your goals, answer your questions, and finalize the engagement. Reach out today to lock in your project start date and give Acme Corp the marketing website it deserves.
